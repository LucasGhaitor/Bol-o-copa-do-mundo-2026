<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | Bolão Copa 2026</title>
  <link rel="stylesheet" href="CSS\Auth.css" />
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <h1>Criar conta</h1>
      <p>Entre no bolão da Copa do Mundo 2026</p>

      <form id="formCadastro">
        <input type="text" id="nome" placeholder="Nome completo" required />
        <input type="text" id="usuario" placeholder="Nome de usuário" required />
        <input type="email" id="email" placeholder="E-mail para recuperação" required />
        <input type="password" id="senha" placeholder="Senha" required />
        <input type="password" id="confirmarSenha" placeholder="Confirmar senha" required />

        <div class="selecao-container">
          <h3>Selecione sua bandeira favorita</h3>

          <div class="flags-grid">
            <label>
              <input type="radio" name="bandeira" value="BRA" required />
              <img src="Assets/Icon/BRA.png"Brasil" />
              <span>Brasil</span>
            </label>

            <label>
              <input type="radio" name="bandeira" value="ARG" />
              <img src="Assets/Icon/ARG.png" alt="Argentina" />
              <span>Argentina</span>
            </label>

            <label>
              <input type="radio" name="bandeira" value="FRA" />
              <img src="Assets/Icon/FRA.png" alt="França" />
              <span>França</span>
            </label>

            <label>
              <input type="radio" name="bandeira" value="POR" />
              <img src="assets/icon/POR.png" alt="Portugal" />
              <span>Portugal</span>
            </label>

            <label>
              <input type="radio" name="bandeira" value="ESP" />
              <img src="assets/icon/ESP.png" alt="Espanha" />
              <span>Espanha</span>
            </label>

            <label>
              <input type="radio" name="bandeira" value="GER" />
              <img src="assets/icon/GER.png" alt="Alemanha" />
              <span>Alemanha</span>
            </label>
          </div>
        </div>

        <button type="submit">Cadastrar</button>
      </form>

      <span id="mensagem"></span>

      <a href="login.html">Já tenho conta</a>
    </section>
  </main>

  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
